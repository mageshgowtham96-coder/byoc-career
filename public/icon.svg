<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="chakraCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  
  <!-- Outer Aura Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#chakraCoreGlow)" />

  <g transform="translate(256 256)" filter="url(#neonGlow)">
    <!-- 16 Geometric Serrated Flames / Chakra Blades -->
    <g stroke="url(#bladeGrad)" stroke-width="2.5" stroke-linecap="round">
      <!-- 16 Spoke Array -->
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(22.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(45)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(67.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(90)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(112.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(135)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(157.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(180)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(202.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(225)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(247.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(270)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(292.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(315)" fill="url(#bladeGrad)" fill-opacity="0.85" />
      <path d="M 0 -220 L 22 -180 L 8 -165 Z" transform="rotate(337.5)" fill="url(#bladeGrad)" fill-opacity="0.85" />
    </g>

    <!-- Outer Precision Serrated Ring -->
    <circle cx="0" cy="0" r="165" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" fill="none" />
    <circle cx="0" cy="0" r="150" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 6" fill="none" />
    
    <!-- Concentric Micro Nodes -->
    <circle cx="0" cy="-150" r="4" fill="#38bdf8"/>
    <circle cx="106" cy="-106" r="4" fill="#38bdf8"/>
    <circle cx="150" cy="0" r="4" fill="#38bdf8"/>
    <circle cx="106" cy="106" r="4" fill="#38bdf8"/>
    <circle cx="0" cy="150" r="4" fill="#38bdf8"/>
    <circle cx="-106" cy="106" r="4" fill="#38bdf8"/>
    <circle cx="-150" cy="0" r="4" fill="#38bdf8"/>
    <circle cx="-106" cy="-106" r="4" fill="#38bdf8"/>

    <!-- Sacred Shatkona & Inner Geometric Lines -->
    <polygon points="0,-120 103.9,60 -103.9,60" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.9"/>
    <polygon points="0,120 103.9,-60 -103.9,-60" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.9"/>

    <!-- Concentric Inner Glowing Rings -->
    <circle cx="0" cy="0" r="75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" fill="none" />
    <circle cx="0" cy="0" r="45" stroke="#c084fc" stroke-width="2.5" fill="none" />
    
    <!-- Central Radiance Core (Sudarsana Bindu) -->
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#38bdf8" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
