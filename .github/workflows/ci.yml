name: BYOC CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: byoc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Install dependencies and synchronize lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies and reconcile Bun lockfile
        run: bun install

      - name: Commit synchronized lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize Bun lockfile"
            git push
          fi

  quality:
    name: TypeScript, tests and web build
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify legacy job feeds are absent from src
        run: |
          if grep -riE "[r]emotive|[r]emoteok|remote[ ]ok|[j]obicy|[a]rbeitnow|[a]dzuna" src/; then
            echo "Legacy job-feed references remain in src/."
            exit 1
          fi
          echo "Verified: no legacy job-feed references in src/."

      - name: TypeScript check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production web build
        run: bun run build

      - name: Verify web build output
        run: test -s dist/index.html

  android-apk:
    if: github.event_name != 'pull_request'
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 40
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Synchronize Capacitor Android project
        run: bunx cap sync android

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin

      - name: Commit generated Gradle wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build(android): add Gradle 8.14.3 wrapper"
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            git push origin "HEAD:${branch}"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BYOC-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
