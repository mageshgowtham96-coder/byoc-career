appId: com.byoc.career
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "AES-256-GCM Local Vault"
    timeout: 60000

# Fresh install: initialize the encrypted local workspace before expecting profile UI.
- runFlow:
    when:
      visible: "Your full name"
    label: "Create the first encrypted workspace"
    commands:
      - tapOn: "Your full name"
      - inputText: "BYOC E2E Candidate"
      - tapOn: "you@domain.com"
      - inputText: "byoc-e2e@example.test"
      - tapOn: "Passphrase for AES-256-GCM key derivation"
      - inputText: "Byoc-E2E-Strong-Passphrase-2026"
      - tapOn: "Create encrypted workspace"
      - extendedWaitUntil:
          visible: "Emergency Recovery Phrase Generated"
          timeout: 30000
      - assertVisible: "I Have Saved My Recovery Phrase"
      - tapOn:
          text: "I Have Saved My Recovery Phrase.*"
      - extendedWaitUntil:
          visible: "Master Intake"
          timeout: 30000

# Warm/persisted install: unlock the existing vault instead of assuming registration.
- runFlow:
    when:
      visible: "Enter vault passphrase"
    label: "Unlock an existing encrypted workspace"
    commands:
      - tapOn: "Enter vault passphrase"
      - inputText: "Byoc-E2E-Strong-Passphrase-2026"
      - tapOn: "Unlock local vault"
      - extendedWaitUntil:
          visible: "Master Intake"
          timeout: 30000

- assertVisible: "Master Intake"
- takeScreenshot: "artifacts/first-run-vault-registration-or-unlock"
- tapOn: "Master Intake"
- assertVisible: "Master Resume Intake & Structural Builder"
- tapOn: "Tap to Upload or Drag Resume File"
- extendedWaitUntil:
    visible: "Downloads"
    timeout: 15000
- tapOn: "Downloads"
- tapOn: "byoc-e2e-resume.docx"
- extendedWaitUntil:
    visible: "Mandatory Review Gate.*"
    timeout: 30000
- assertNotVisible: "Half-Built Resume Detected"
- tapOn: "Approve & Save to Master Profile"
- assertVisible: "Saved in Vault"
- tapOn: "Proceed to Sourcing"
- assertVisible: "Opportunity Sourcing & Role Upgrade Engine"
- tapOn: "Search any role, skill or keyword..."
- inputText: "Supp"
- assertVisible: "Customer Support Specialist"
- takeScreenshot: "artifacts/autocomplete-keyboard-open"
- tapOn: "Customer Support Specialist"
- extendedWaitUntil:
    visible: "Sources Queried:.*"
    timeout: 45000

# Cold restart proves the encrypted vault and imported profile survive process death.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "AES-256-GCM Local Vault"
    timeout: 30000
- tapOn: "Enter vault passphrase"
- inputText: "Byoc-E2E-Strong-Passphrase-2026"
- tapOn: "Unlock local vault"
- extendedWaitUntil:
    visible: "Master Intake"
    timeout: 30000
- tapOn: "Master Intake"
- assertVisible: "Saved in Vault"
- tapOn: "Export PDF"
- extendedWaitUntil:
    visible: "Master Resume Exported"
    timeout: 15000
- tapOn: "Export DOCX"
- extendedWaitUntil:
    visible: "Master Resume Exported"
    timeout: 15000
