appId: com.byoc.career
---
# CI emulators occasionally drop back to the launcher right after launch
# (BYOC is not in the foreground). Relaunch with a clean state if the vault
# screen does not appear.
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "AES-256-GCM Local Vault"
          timeout: 60000

# Fresh install: initialize the encrypted local workspace before expecting profile UI.
- runFlow:
    when:
      visible: "Your full name"
    label: "Create the first encrypted workspace"
    commands:
      - tapOn: "Your full name"
      - inputText: "BYOC E2E Candidate"
      - hideKeyboard
      - tapOn: "you@domain.com"
      - inputText: "byoc-e2e@example.test"
      - hideKeyboard
      - tapOn: "Passphrase for AES-256-GCM key derivation"
      - inputText: "Byoc-E2E-Strong-Passphrase-2026"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Create encrypted workspace"
          direction: DOWN
      - tapOn: "Create encrypted workspace"
      - extendedWaitUntil:
          visible: "Emergency Recovery Phrase Generated"
          timeout: 30000
      - scrollUntilVisible:
          element: "I have written down or securely stored my recovery phrase.*"
          direction: DOWN
      - assertVisible: "I have written down or securely stored my recovery phrase.*"
      - tapOn: "I have written down or securely stored my recovery phrase.*"
      - assertVisible: "I Have Saved My Recovery Phrase.*"
      - scrollUntilVisible:
          element: "I Have Saved My Recovery Phrase.*"
          direction: DOWN
      - tapOn:
          text: "I Have Saved My Recovery Phrase.*"
      - extendedWaitUntil:
          visible: "Master Intake"
          timeout: 30000

# Warm/persisted install: unlock the existing vault instead of assuming registration.
- runFlow:
    when:
      visible: "Enter vault passphrase"
    label: "Unlock an existing encrypted workspace"
    commands:
      - tapOn: "Enter vault passphrase"
      - inputText: "Byoc-E2E-Strong-Passphrase-2026"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Unlock local vault"
          direction: DOWN
      - tapOn: "Unlock local vault"
      - extendedWaitUntil:
          visible: "Master Intake"
          timeout: 30000

- assertVisible: "Master Intake"
- takeScreenshot: "artifacts/first-run-vault-registration-or-unlock"
- tapOn: "Master Intake"
- assertVisible: "Master Resume Intake & Structural Builder"
- tapOn: "Tap to Upload or Drag Resume File"
# Android 14 system picker (com.google.android.documentsui) may open in Recent,
# directly in Downloads, or with the roots drawer closed. Handle each case.
- extendedWaitUntil:
    visible: ".*(Recent|Downloads|Show roots|byoc-e2e-resume\\.docx).*"
    timeout: 30000
- runFlow:
    when:
      notVisible: "byoc-e2e-resume.docx"
    label: "Navigate the picker to Downloads"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn: "Downloads"
- extendedWaitUntil:
    visible: "byoc-e2e-resume.docx"
    timeout: 15000
- tapOn: "byoc-e2e-resume.docx"
- extendedWaitUntil:
    visible: "Mandatory Review Gate.*"
    timeout: 30000
- assertNotVisible: "Half-Built Resume Detected"
- scrollUntilVisible:
    element: "Approve & Save to Master Profile"
    direction: DOWN
    timeout: 90000
    speed: 85
    centerElement: true
- tapOn: "Approve & Save to Master Profile"
- assertVisible: "Saved in Vault"
- scrollUntilVisible:
    element: "Proceed to Sourcing"
    direction: DOWN
    timeout: 90000
    speed: 85
    centerElement: true
- tapOn: "Proceed to Sourcing"
- assertVisible: "Opportunity Sourcing & Role Upgrade Engine"
- tapOn: "Search any role, skill or keyword..."
- inputText: "Supp"
- hideKeyboard
- assertVisible: "Customer Support Specialist"
- takeScreenshot: "artifacts/autocomplete-keyboard-open"
- tapOn: "Customer Support Specialist"
- extendedWaitUntil:
    visible: "Sources Queried:.*"
    timeout: 45000

# Cold restart proves the encrypted vault and imported profile survive process death.
- stopApp
- retry:
    maxRetries: 3
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: "AES-256-GCM Local Vault"
          timeout: 60000
- tapOn: "Enter vault passphrase"
- inputText: "Byoc-E2E-Strong-Passphrase-2026"
- hideKeyboard
- scrollUntilVisible:
    element: "Unlock local vault"
    direction: DOWN
- tapOn: "Unlock local vault"
- extendedWaitUntil:
    visible: "Master Intake"
    timeout: 30000
- tapOn: "Master Intake"
- assertVisible: "Saved in Vault"
- scrollUntilVisible:
    element: "Export PDF"
    direction: DOWN
    timeout: 90000
    speed: 85
    centerElement: true
- tapOn: "Export PDF"
- extendedWaitUntil:
    visible: "Master Resume Exported"
    timeout: 15000
- scrollUntilVisible:
    element: "Export DOCX"
    direction: DOWN
    timeout: 90000
    speed: 85
    centerElement: true
- tapOn: "Export DOCX"
- extendedWaitUntil:
    visible: "Master Resume Exported"
    timeout: 15000
